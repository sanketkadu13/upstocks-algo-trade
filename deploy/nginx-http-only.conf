# Plain-HTTP reverse proxy — for when there is no domain yet.
#
# READ THIS: with no TLS, your dashboard password and everything the page
# shows (positions, P&L, and the Upstox OAuth redirect carrying the auth
# code) travel unencrypted. Basic auth over HTTP sends the password in
# base64 on every request, which is encoding, not encryption.
#
# This is acceptable only when the security group restricts access to your
# own IP. Point a domain at this host and switch to nginx-nifty-engine.conf
# as soon as you can.

server {
    listen 80 default_server;
    server_name _;

    # The dashboard can place real orders — never leave it unauthenticated.
    auth_basic "NIFTY Engine";
    auth_basic_user_file /etc/nginx/.htpasswd-nifty;

    # Don't advertise the nginx version.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Clipboard copy of the TOTP needs a secure context; on plain HTTP the
    # dashboard silently falls back to a textarea copy. Another reason to
    # get TLS.

    client_max_body_size 4m;

    location /static/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Server-sent events. Buffering here makes the dashboard look frozen,
    # because nginx would hold each frame until its buffer filled.
    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
