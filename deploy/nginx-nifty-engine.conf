# Reverse proxy for the NIFTY options engine.
#
# This app can place real orders, so it is never exposed without auth. The
# reference setup this replaces ran HTTP Basic auth over plain port 80 —
# credentials and every response in clear text. Here TLS is the default path
# and the plain-HTTP server only redirects.

server {
    listen 80;
    server_name _;

    # Certbot needs this reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # Replace with your real certificate paths (certbot writes these).
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    auth_basic "NIFTY Engine";
    auth_basic_user_file /etc/nginx/.htpasswd-nifty;

    # Static assets don't need auth and don't need buffering tweaks.
    location /static/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }

    # Server-sent events: buffering here would make the dashboard appear
    # frozen, because nginx would hold each frame until its buffer filled.
    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
